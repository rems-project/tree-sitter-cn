name: archlinux
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm git tree-sitter-cli github-cli
      - uses: actions/checkout@v7
      - working-directory: contrib/archlinux
        run: |
          useradd build
          chown -R build .
          runuser -u build -- makepkg --skipchecksums
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" contrib/archlinux/*.pkg.tar.zst
        env:
          GH_TOKEN: ${{ github.token }}
