[package]
name = "tree-sitter-cn"
description = "Tree-sitter grammar for CN, the separation-logic specification language for C"
version = "0.1.1"
authors = ["RE Ltd"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "cn"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/rems-project/tree-sitter-cn"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.26.9"
